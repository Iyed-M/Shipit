name: shipit

services:
  shipit:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shipit-data:/data
      - caddy-admin:/run/caddy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # --resume reuses the last config Shipit loaded, so apps keep serving while
    # Shipit is down. The bootstrap file only applies on the very first start.
    command: caddy run --resume --config /etc/caddy/bootstrap.json
    ports:
      - "${SHIPIT_HTTP_PORT:-80}:80"
      - "${SHIPIT_HTTPS_PORT:-443}:443"
      - "${SHIPIT_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/caddy-bootstrap.json:/etc/caddy/bootstrap.json:ro
      - ${SHIPIT_STATIC_DIR:-./deploy/no-static-site}:/srv/site:ro
      - caddy-admin:/run/caddy
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
      - apps

networks:
  internal:
  # Apps join this network by name, so Caddy can reach them. Shipit's API and
  # Caddy's admin socket aren't exposed on it.
  apps:
    name: shipit-apps

volumes:
  shipit-data:
  caddy-admin:
  caddy-data:
  caddy-config:
